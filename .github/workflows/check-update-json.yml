name: Check update.json

# The As It Is app reads update.json from this repository each time it starts. This check runs on
# every change to it, and when a release is published, so a broken file or a wrong link is seen
# here first, not by readers.
on:
  push:
    branches: [main]
    paths: [update.json, .github/**]
  pull_request:
    paths: [update.json, .github/**]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check update.json and the APK it names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_update_json.py
