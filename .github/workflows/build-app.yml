# Builds the As It Is app here, in this public repository, from its private source repository
# rushhour8/AsItIs (owner's choice, November 2026: a public repository's Actions minutes are free).
# The code is changed in AsItIs only; this repository only builds it.
#
# Only by hand: Actions > Build the app > Run workflow. Only people with write access to this
# repository can start it; nothing from a fork or a pull request can.
#
# This repository's logs and artifacts are public, so nothing in them may show the books:
# - every Gradle and test output goes to a file on the runner that is never printed or uploaded;
#   only counts, the APKs' checks and the names of failed tests are shown;
# - no Actions cache is used (a cache can be read by other runs of this repository);
# - only the one signed APK is uploaded (never a debug APK, a report or a database). The
#   library's files, encrypted like those already in library/, are uploaded only when asked to
#   publish them, or when some are new.
#
# One APK only (owner's decision, 13 Nov 2026): "AsItIs-v<version>.apk", the library APK — every
# processor (ARM and Intel), no book inside: on its first start the phone proves itself genuine to the
# key server (keys.asitis.cc: hardware attestation, not rooted), receives the books' key, then
# downloads the library once from Cloudflare (GitHub's library/ in reserve). No books-inside APK is
# built any more (Universal, compressed-universal, legacy-release).
#
# Secrets (Settings > Secrets and variables > Actions):
#   ASITIS_SOURCE_TOKEN  a fine-grained personal access token, Repository access: only
#                        rushhour8/AsItIs, Permissions: Contents: Read-only. Fetches the source.
#   ASITIS_KEYSTORE_BASE64, ASITIS_KEYSTORE_PASSWORD, ASITIS_KEY_ALIAS, ASITIS_KEY_PASSWORD
#                        the release key, as in AsItIs.
#   ASITIS_LIBRARY_KEY   the books' key (64 hex characters), the same value as the key server's
#                        LIBRARY_KEY secret on Cloudflare. Only the library step sees it; it never
#                        enters the APK (the APK check fails the build if it does).
name: Build the app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of rushhour8/AsItIs to build"
        required: true
        default: claude/as-it-is-android-planning-8rqqkp
      tests:
        description: "Run the tests first (about 40 minutes)"
        type: boolean
        default: true
      publish_library:
        description: "Put the library's files in library/ here, removing files no longer listed (and copy them to Cloudflare)"
        type: boolean
        default: false
      release_tag:
        description: "Also make a draft release with the APK under this tag (empty: no release)"
        required: false
        default: ""
      publish_release:
        description: "Publish that release at once (not a draft): update.json set to its APK, the APK copied to app.asitis.cc/apk/"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-the-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # library/ and the draft release, only when asked
      actions: write    # start Sync to Cloudflare; remove earlier builds' artifacts
    env:
      REF: ${{ inputs.ref }}
      TAG: ${{ inputs.release_tag }}
      ASITIS_PUBLIC_LOG: "1"
    steps:
      - name: Check the inputs and the secrets
        env:
          SOURCE_TOKEN: ${{ secrets.ASITIS_SOURCE_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.ASITIS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASITIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASITIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASITIS_KEY_PASSWORD }}
          LIBRARY_KEY: ${{ secrets.ASITIS_LIBRARY_KEY }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::The ref '$REF' has characters a branch, tag or commit does not have"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::The release tag may only have letters, digits, '.', '_' and '-'"; exit 1; }
          missing=""
          [ -n "$SOURCE_TOKEN" ] || missing="$missing ASITIS_SOURCE_TOKEN"
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ASITIS_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ASITIS_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ASITIS_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ASITIS_KEY_PASSWORD"
          # the library's books key (server-held; the same value as the key server's LIBRARY_KEY)
          [ -n "$LIBRARY_KEY" ] || missing="$missing ASITIS_LIBRARY_KEY"
          if [ -n "$LIBRARY_KEY" ] && ! [[ "$LIBRARY_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::ASITIS_LIBRARY_KEY must be 64 hexadecimal characters (openssl rand -hex 32)"; exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::These secrets are not set (Settings > Secrets and variables > Actions):$missing"; exit 1
          fi
          echo "LOG=$RUNNER_TEMP/gradle.log" >> "$GITHUB_ENV"
          echo "Building rushhour8/AsItIs at $REF"

      - name: Check out this repository (library/)
        uses: actions/checkout@v4
        with:
          path: releases

      - name: Check out the app's source (rushhour8/AsItIs)
        uses: actions/checkout@v4
        with:
          repository: rushhour8/AsItIs
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ASITIS_SOURCE_TOKEN }}
          path: src
          persist-credentials: false

      - name: Read the app's version
        id: version
        working-directory: src
        run: |
          set -euo pipefail
          V="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          C="$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -1)"
          test -n "$V" && test -n "$C"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "As It Is $V ($C), AsItIs commit $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # (no cache: see the top of this file)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Install the NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      # Gradle's output stays on the runner (the books may be in a failed test's message). On a
      # failure the names of the failed tests and the compiler's errors are shown, nothing more.
      - name: Tests (JVM / Robolectric), lint, and the tests on Android 6.0 and 7.x
        if: inputs.tests
        working-directory: src
        run: |
          set -uo pipefail
          summary() {
            python3 - "$1" <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          t = f = s = 0
          failed = []
          for p in glob.glob(sys.argv[1] + "/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); s += int(r.get("skipped", 0))
              for tc in r.iter("testcase"):
                  bad = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  if bad is not None:
                      # the exception's class only: its message can quote a book
                      kind = (bad.get("type") or "?").rsplit(".", 1)[-1]
                      failed.append(f"{tc.get('classname')}.{tc.get('name')} ({kind})")
          f = len(failed)
          print(f"{t} run, {f} failed, {s} skipped")
          for n in failed[:60]:
              print(f"::error::Test failed: {n}")
          EOF
          }
          compile_errors() { grep -E '^e: ' "$LOG" | sed -E 's#file://[^ ]*/src/##' | head -30 | while IFS= read -r l; do echo "::error::$l"; done || true; }
          if ! ./gradlew testDebugUnitTest > "$LOG" 2>&1; then
            compile_errors; echo "Tests: $(summary app/build/test-results/testDebugUnitTest)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::The tests failed"; exit 1
          fi
          echo "Tests: $(summary app/build/test-results/testDebugUnitTest)" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! ./gradlew lintDebug >> "$LOG" 2>&1; then
            compile_errors; echo "::error::Android lint failed"; exit 1
          fi
          R=app/build/test-results/testDebugUnitTest
          cp -r "$R" "$RUNNER_TEMP/main-results"
          legacy() { ./gradlew testDebugUnitTest -Pasitis.apkType=legacy --tests 'cc.asitis.app.legacy.*' > "$RUNNER_TEMP/legacy.log" 2>&1; }
          if ! legacy; then
            # (Robolectric fetches each Android version's runtime from Maven Central as the tests start)
            if grep -q "Failed to fetch maven artifact" "$RUNNER_TEMP/legacy.log"; then
              echo "::warning::Maven Central refused a Robolectric runtime; trying once more"; sleep 60
              legacy || { echo "Legacy tests: $(summary "$R")"; echo "::error::The tests on Android 6.0 and 7.x failed"; exit 1; }
            else
              echo "Legacy tests: $(summary "$R")"; echo "::error::The tests on Android 6.0 and 7.x failed"; exit 1
            fi
          fi
          echo "Tests on Android 6.0-7.1: $(summary "$R")" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$R" && cp -r "$RUNNER_TEMP/main-results" "$R"

      # The one APK (no book in it: it downloads the library on its first start) and the library's
      # files, sealed with ASITIS_LIBRARY_KEY: the same books and the same key give the same files, so
      # only the files not yet in library/ here are new.
      - name: Build and check the APK and its library
        id: library
        working-directory: src
        env:
          KEYSTORE_BASE64: ${{ secrets.ASITIS_KEYSTORE_BASE64 }}
          ASITIS_SIGNING_STORE_PASSWORD: ${{ secrets.ASITIS_KEYSTORE_PASSWORD }}
          ASITIS_SIGNING_KEY_ALIAS: ${{ secrets.ASITIS_KEY_ALIAS }}
          ASITIS_SIGNING_KEY_PASSWORD: ${{ secrets.ASITIS_KEY_PASSWORD }}
          # the books are sealed with the server-held key (only this step sees it; never in the APK,
          # the check below fails the build if it is)
          ASITIS_LIBRARY_KEY: ${{ secrets.ASITIS_LIBRARY_KEY }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ASITIS_SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease -Pasitis.apkType=library >> "$LOG" 2>&1 || { rm -f "$RUNNER_TEMP/release.jks"; echo "::error::The library build failed"; exit 1; }
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p "$GITHUB_WORKSPACE/upload"
          A="$GITHUB_WORKSPACE/upload/AsItIs-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$A"
          LIB=app/build/asitis/library/release
          # (the check opens every sealed file with the build's keys: Python's cryptography package)
          python3 -m venv "$RUNNER_TEMP/m4" && "$RUNNER_TEMP/m4/bin/pip" install --quiet cryptography
          bash .github/scripts/check_apk_type.sh "$A" library app/build/asitis/plain/release true "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "$LIB"
          NEW="$GITHUB_WORKSPACE/library-new/library"
          mkdir -p "$NEW"
          missing=0; total=0
          for f in "$LIB"/*.sealed; do
            total=$((total + 1)); n=$(basename "$f")
            if [ -f "$GITHUB_WORKSPACE/releases/library/$n" ] && cmp -s "$f" "$GITHUB_WORKSPACE/releases/library/$n"; then :; else
              missing=$((missing + 1)); cp "$f" "$NEW/"; echo "new: $n"
            fi
          done
          cp "$LIB/library.json" "$NEW/"
          # library/'s files this build does not list (an earlier key's): removed when published
          stale=0
          for f in "$GITHUB_WORKSPACE"/releases/library/*.sealed; do
            [ -e "$f" ] || continue
            [ -f "$LIB/$(basename "$f")" ] || stale=$((stale + 1))
          done
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          cmp -s "$LIB/library.json" "$GITHUB_WORKSPACE/releases/library/library.json" && changed=false || changed=true
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "mb=$(( ($(cat "$LIB"/*.sealed | wc -c) + 500000) / 1000000 ))" >> "$GITHUB_OUTPUT"
          echo "Library: $total files, $missing not yet in library/ here, $stale there no longer listed; library.json changed: $changed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The APK's SHA-256 (for update.json)
        run: |
          cd upload
          { echo; echo '| APK | Bytes | SHA-256 |'; echo '|---|---|---|'
            for f in *.apk; do echo "| $f | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done; } | tee -a "$GITHUB_STEP_SUMMARY"

      # Only this workflow's latest build is kept among the artifacts.
      - name: Remove earlier builds' artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { owner, repo, workflow_id: 'build-app.yml', per_page: 100 });
            for (const r of runs) {
              if (r.id === context.runId) continue;
              const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: r.id, per_page: 100 });
              for (const a of arts) {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                core.info(`deleted ${a.name}, run ${r.id}`);
              }
            }

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AsItIs-v${{ steps.version.outputs.name }}-APK
          path: upload/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The library's files are encrypted (the same as those published in library/); uploaded only
      # when some are new and they are not being published here at once.
      - name: Upload the library's new files
        if: "!inputs.publish_library && (steps.library.outputs.missing != '0' || steps.library.outputs.changed == 'true' || steps.library.outputs.stale != '0')"
        uses: actions/upload-artifact@v4
        with:
          name: AsItIs-library
          path: library-new/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The new files are added and the files this build does not list are removed (an earlier key's:
      # owner's decision, 13 Nov 2026, the earlier APKs are withdrawn); then Sync to Cloudflare makes
      # library.asitis.cc the same as library/ (copies what differs, removes what library/ has not).
      - name: Publish the library in library/
        if: inputs.publish_library && (steps.library.outputs.missing != '0' || steps.library.outputs.changed == 'true' || steps.library.outputs.stale != '0')
        working-directory: releases
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE"/library-new/library/* library/
          LIB="$GITHUB_WORKSPACE/src/app/build/asitis/library/release"
          for f in library/*.sealed; do
            [ -e "$f" ] || continue
            [ -f "$LIB/$(basename "$f")" ] || { git rm -q "$f"; echo "removed: $(basename "$f")"; }
          done
          # every file listed is here and is the build's
          for f in "$LIB"/*.sealed; do cmp -s "$f" "library/$(basename "$f")" || { echo "::error::$(basename "$f") is not in library/ as built"; exit 1; }; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          git commit -q -m "library: files from the build of AsItIs ${SRC_SHA:0:12}"
          git push origin HEAD:main
          gh workflow run sync-to-cloudflare.yml --ref main
          echo "Library published in library/; Sync to Cloudflare started" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make the release with the APK (a draft, or published when asked)
        if: inputs.release_tag != ''
        working-directory: releases
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          # a DRAFT under this tag (an earlier build not yet published) is replaced by this build's;
          # a published release is never touched
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              gh release delete "$TAG" --yes
              echo "The earlier draft $TAG was replaced by this build's" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::A published release '$TAG' already exists"; exit 1
            fi
          fi
          V="${{ steps.version.outputs.name }}"
          U="$GITHUB_WORKSPACE/upload"
          W=$(( ($(stat -c %s "$U/AsItIs-v$V.apk") + 500000) / 1000000 )); B="${{ steps.library.outputs.mb }}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## 📥 Download

          **\`AsItIs-v$V.apk\`** · $W MB — the one file, for **every phone** (ARM and Intel).

          - On its **first start** the app downloads Śrīla Prabhupāda's original books library **once** (about **$B MB**, *Wi-Fi recommended*), then works **fully offline**.
          - Needs **Android 7.0 or newer**, on a phone whose system has not been changed (**not rooted**, bootloader locked): the books are given only to such phones.
          - The dictionary (*Define*) is built in. *Translate (English → Hindi) downloads its language pack once, the first time you use it.*

          > If an earlier As It Is is installed, **uninstall it first**, then install this one.
          EOF
          if [ "${{ inputs.publish_release }}" != "true" ]; then
            gh release create "$TAG" --draft --title "AsItIs-v$V" --notes-file "$RUNNER_TEMP/notes.md" "$U"/*.apk
            echo "Draft release $TAG made (publish it from Releases: Sync to Cloudflare then copies the APK to app.asitis.cc/apk/)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # published at once (owner's request, 14 Nov 2026): the release, then update.json set to its
          # APK (version, links, SHA-256, size; the notes and "mandatory" stay as the owner wrote them),
          # then Sync to Cloudflare (a release made by this workflow does not start it by itself): the
          # APK to app.asitis.cc/apk/, update.json and the library to Cloudflare
          gh release create "$TAG" --latest --title "AsItIs-v$V" --notes-file "$RUNNER_TEMP/notes.md" "$U"/*.apk
          A="$U/AsItIs-v$V.apk"
          python3 -I "$GITHUB_WORKSPACE/releases/.github/scripts/set_update_json.py" update.json \
            --code "${{ steps.version.outputs.code }}" --name "$V" \
            --primary "https://app.asitis.cc/apk/AsItIs-v$V.apk" \
            --secondary "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/AsItIs-v$V.apk" \
            --sha256 "$(sha256sum "$A" | cut -d' ' -f1)" --size "$(stat -c %s "$A")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- update.json; then
            git add update.json
            git commit -q -m "update.json: $V published (its APK's SHA-256 and size)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
          gh workflow run sync-to-cloudflare.yml --ref main -f release_tag="$TAG"
          echo "Release $TAG published; update.json set to its APK; Sync to Cloudflare started (the APK to app.asitis.cc/apk/)" | tee -a "$GITHUB_STEP_SUMMARY"
