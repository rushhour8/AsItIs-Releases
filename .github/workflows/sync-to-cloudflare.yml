# Makes Cloudflare R2 the same as this repository, where the app reads first (owner's choice,
# November 2026): GitHub stays the place the files are edited, and the app's reserve when Cloudflare
# does not answer (blocked by the owner's firewall rule, or down); the app goes back to Cloudflare
# on its own as soon as it answers again.
#
#   update.json, share.json, notification.json, policy.json  ->  bucket asitis-app      (https://app.asitis.cc/)
#   library/*.sealed, library/library.json                    ->  bucket asitis-library  (https://library.asitis.cc/)
#   the published release's APK                               ->  bucket asitis-app, apk/ (https://app.asitis.cc/apk/)
#
# Runs on each push to main that changes one of them, when a release is published (its APK), and by
# hand (Actions > Sync to Cloudflare > Run workflow). Everything goes through Cloudflare's API
# (.github/scripts/sync_r2.py): a file is copied only when R2 has not the same bytes, read back and
# compared; R2's sealed files that library/ no longer has are removed (an earlier key's), and on a
# release every other APK under apk/. It never reads the public addresses, so it works while the
# firewall rule blocks them.
#
# Secrets (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (an API token with
# "Workers R2 Storage: Edit" on this account) and CLOUDFLARE_ACCOUNT_ID. Without them it does
# nothing and says so.
name: Sync to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - update.json
      - share.json
      - notification.json
      - policy.json
      - library/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-cloudflare
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # (a release's own tag may be older than main: the files are always main's)
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: The published release's APK
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/apk"
          ls -l "$RUNNER_TEMP/apk"

      - name: Make Cloudflare the same as this repository
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -d "$RUNNER_TEMP/apk" ]; then
            for f in "$RUNNER_TEMP"/apk/*.apk; do [ -e "$f" ] && args+=(--apk "$f"); done
          fi
          python3 -I .github/scripts/sync_r2.py "${args[@]}"
